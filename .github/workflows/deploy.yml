name: Deploy GitHub Pages

on:
  push:
    branches:
      - main  # หรือ master ขึ้นอยู่กับชื่อ Branch หลักของคุณ

# กำหนดสิทธิ์ให้ Workflow สามารถ Deploy ลง GitHub Pages ได้
permissions:
  contents: read
  pages: write
  id-token: write

# อนุญาตให้รัน Concurrent Deployment ได้ครั้งละ 1 งาน
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ระบุ Folder ที่เก็บไฟล์ index.html (ใช้ '.' หากอยู่ที่ Root Directory)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
